apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp310-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp310-api
  template:
    metadata:
      labels:
        app: mp310-api
    spec:
      containers:
        - name: mp310-api
          image: mp310-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
